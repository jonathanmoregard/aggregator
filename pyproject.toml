[project]
name = "aggregator"
version = "0.0.1"
description = "Personal data aggregator (sessions + GitHub) with FastMCP + CLI surfaces"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=0.4",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  # NB: `claude-runner` was previously listed as a placeholder for a "reserved
  # LLM wrapper" seam in sources/. v1 makes no LLM calls, both source imports
  # were dropped (round-1 in sessions.py, round-2 in github.py), and no test
  # or prod code path references it — so it's no longer a real dependency.
  # Re-add here when enrichment actually lands.
]

[project.scripts]
aggregator = "aggregator.cli:main"
aggregator-mcp = "aggregator.mcp:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["aggregator"]
