[project]
name = "aggregator"
version = "0.0.1"
description = "Personal data aggregator (sessions + GitHub) with FastMCP + CLI surfaces"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=0.4",
  # TLS trust anchors for the TickTick Open API client, which is the only
  # source that speaks HTTPS from Python (github shells out to `gh`). Already
  # present transitively; declared explicitly because `sources/ticktick_api.py`
  # now imports it directly. On 2026-08-15 the systemd unit's empty trust store
  # made `ssl.create_default_context()` load ZERO CAs and every TickTick
  # handshake failed — see `_ssl_context` there.
  "certifi",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  # Dropbox source document extraction. Deliberately in the main dependency
  # list rather than an extras group: with extras, a missing install turns
  # ~590 Dropbox files into a silent gap in search results, and a silent gap
  # is the one failure mode this index cannot tolerate.
  "pypdf>=5.0",
  "python-docx>=1.1",
]

[project.scripts]
aggregator = "aggregator.cli:main"
aggregator-mcp = "aggregator.mcp:main"
# The schema-health probe, declared so the SessionStart hook and the systemd
# health unit CAN run the PRODUCTION artifact — installed next to
# `aggregator-mcp`, built from the same rev as the reader it measures — instead
# of reaching into a developer checkout. Declaring it here is necessary and not
# sufficient: until nixos-config's `overlays/aggregator.nix` enumerates the name
# among the programs it wraps, the profile will not carry the script and the
# callers keep using the checkout. Exposing it as a console script is only
# safe because `aggregator/__init__.py`, `aggregator/health/__init__.py` and the
# module itself are stdlib-only: the entry point imports all three, and a heavy
# import here would blow the single-digit-second budget both callers run on.
# Locked by tests/test_schema_health_probe.py::test_the_packaged_entry_point_imports_nothing_heavy.
aggregator-schema-probe = "aggregator.health.schema_probe:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["aggregator"]
