[project]
name = "aggregator"
version = "0.0.1"
description = "Personal data aggregator (sessions + GitHub) with FastMCP + CLI surfaces"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=0.4",
  # TLS trust anchors for the TickTick Open API client, which is the only
  # source that speaks HTTPS from Python (github shells out to `gh`). Already
  # present transitively; declared explicitly because `sources/ticktick_api.py`
  # now imports it directly. On 2026-08-15 the systemd unit's empty trust store
  # made `ssl.create_default_context()` load ZERO CAs and every TickTick
  # handshake failed — see `_ssl_context` there.
  "certifi",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  # Dropbox source document extraction. Deliberately in the main dependency
  # list rather than an extras group: with extras, a missing install turns
  # ~590 Dropbox files into a silent gap in search results, and a silent gap
  # is the one failure mode this index cannot tolerate.
  "pypdf>=6.16.1",
  "python-docx>=1.1",
  # v5 RAG / hybrid retrieval. `sqlite-vec` is the vector index; it ships as a
  # loadable SQLite extension, and the store loads it BEST-EFFORT — see
  # `Store._load_vector_extension`. Declaring it here does not make the vector
  # arm mandatory: FTS5 recall keeps working when the extension is absent or
  # ABI-mismatched, which is the whole point of the degrade path.
  "sqlite-vec>=0.1.6",
  "sentence-transformers>=3.0",
  # Declared DIRECTLY even though `sentence-transformers` already pulls it.
  # `[tool.uv.sources]` below binds only direct dependencies, so pinning torch
  # to the CPU index has no effect while torch is merely transitive — the
  # resolver keeps taking the CUDA build from PyPI and the NixOS packaging
  # fails on it. See the comment on that block for the whole story.
  "torch>=2.0",
  "numpy>=2.0",
]

[project.scripts]
aggregator = "aggregator.cli:main"
aggregator-mcp = "aggregator.mcp:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]
embed-gguf = [
  "llama-cpp-python>=0.3",
]

# ---------------------------------------------------------------------------
# torch: CPU WHEELS ONLY, and this is not a size preference.
#
# `sentence-transformers` pulls `torch`, and the default PyPI `torch` wheel
# vendors the entire NVIDIA CUDA stack as hard dependencies — nvidia-cublas,
# nvidia-cudnn, nvidia-cufile and a dozen more, several hundred MB each. This
# deployment is CPU-only by design (documented in docs/embedding-throughput.md:
# every throughput figure here is measured on an i7-1365U at 15 W), so none of
# it can ever execute.
#
# It is not merely wasted bytes. Packaging the default wheel for NixOS FAILS
# OUTRIGHT: `nvidia-cufile` ships `libcufile_rdma.so.1`, which links against
# libmlx5 / librdmacm / libibverbs — InfiniBand RDMA libraries — and
# auto-patchelf cannot satisfy them, so the derivation errors and takes the
# whole aggregator-env with it. The tempting fix at that point is
# `--ignore-missing` on those three sonames, which would paper over the symptom
# and still ship a multi-GB GPU stack that nothing runs.
#
# Pointing torch at PyTorch's CPU index resolves `torch` with no `nvidia-*`
# dependencies at all, which is both the smaller closure and the one that
# builds. `explicit = true` keeps the index scoped to torch — every other
# package still resolves from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["aggregator"]
