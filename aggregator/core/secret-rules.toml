# Secret-detection rules for output redaction: gitleaks defaults + formats gitleaks lacks.
#
# Consumed by `gitleaks dir --config <this file>` (hooks/gitleaks_driver.py). `useDefault` pulls in every
# rule shipped with the installed gitleaks (8.30.1: ~220 providers, incl. all six
# GitHub token types, Anthropic api03/admin01, OpenAI, Slack, HF, Google AIza).
#
# A vendored copy lives in the aggregator repo (aggregator/core/secret-rules.toml).
# Keep both in sync; the aggregator test suite checks the copies are identical.
#
# Sources (2026-10-11 research, reports in ~/Repos/research-agent/reports/
# d8895e18117543938438b2d834ade3ff.md and 83bf06105dc94258b6394ab69e66e829.md):
#   cloudflare-*-v2   TruffleHog pkg/detectors/cloudflare{apitoken,globalapikey}/v2
#   google-oauth-client-secret  GitLab secrets analyzer commit 63743045
#   tavily-api-key    no public spec; shape observed locally (tvly-dev- + 32..50)
#   anthropic-oauth-token, fireworks-api-key  no public spec; prefix-anchored, loose body
#
# Prefix rules without a vendor-fixed length (tavily, fireworks, anthropic-oauth)
# are anchored to a TOKEN boundary, not `\b`: `\b` holds after `/` or `+`, so the
# prefix fired inside base64 blobs (8 `fw_` hits in Codex encrypted reasoning,
# full-transcript scan 2026-10-11). The prefix must follow start-of-line or a
# character outside [A-Za-z0-9+/_-] (`=` stays allowed: `KEY=fw_...`), the body
# is length-bounded, and the token must end at a non-token character.
# Providers with no distinctive prefix (Exa, Fish Audio, Auphonic, Lakera, Hetzner,
# eBay, Tradera, EUIPO; Cachix tokens are JWTs and hit the default `jwt` rule) are
# only caught by the default keyword-proximity `generic-api-key` rule.

title = "agent output redaction rules"

[extend]
useDefault = true

[[rules]]
id = "cloudflare-api-token-v2"
description = "Cloudflare scannable user/account API token (cfut_/cfat_)"
regex = '''\b(cf[ua]t_[a-zA-Z0-9]{40}[a-fA-F0-9]{8})\b'''
keywords = ["cfut_", "cfat_"]

[[rules]]
id = "cloudflare-global-api-key-v2"
description = "Cloudflare scannable global API key (cfk_)"
regex = '''\b(cfk_[a-zA-Z0-9]{40}[a-fA-F0-9]{8})\b'''
keywords = ["cfk_"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
regex = '''\b(GOCSPX-[a-zA-Z0-9_-]{28})(?:[^a-zA-Z0-9_-]|$)'''
keywords = ["gocspx-"]

[[rules]]
id = "anthropic-oauth-token"
description = "Anthropic OAuth token (Claude subscription login)"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(sk-ant-oat\d{2}-[a-zA-Z0-9_-]{40,128})(?:[^a-zA-Z0-9_-]|$)'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "tavily-api-key"
description = "Tavily API key"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(tvly-(?:dev-|prod-)?[a-zA-Z0-9_-]{30,64})(?:[^a-zA-Z0-9+/_-]|$)'''
keywords = ["tvly-"]

[[rules]]
id = "fireworks-api-key"
description = "Fireworks AI API key"
regex = '''(?:^|[^a-zA-Z0-9+/_-])(fw_[a-zA-Z0-9]{20,48})(?:[^a-zA-Z0-9+/_-]|$)'''
keywords = ["fw_"]
